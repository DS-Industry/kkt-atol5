; Supervisor program for Orange Pi.
; The program name on the cash register is flesh.
;
; Install (as root, after adjusting directory= if the project lives elsewhere):
;   sudo cp deploy/flesh.conf /etc/supervisor/conf.d/flesh.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start flesh
;
; Day to day:
;   sudo supervisorctl status
;   sudo supervisorctl status flesh
;   sudo supervisorctl stop flesh
;   sudo supervisorctl start flesh
;   sudo supervisorctl restart flesh
;
; Notes:
; - One process only. Do not set numprocs above 1 and do not use multi-worker
;   Gunicorn. job1 and the cash register must not run in two processes.
; - HTTP host/port come from instance/config.json (typically 0.0.0.0:5000).
;   Changing the bind requires: sudo supervisorctl restart flesh
; - libfptr10 must be installed on the host (usually /usr/lib/).
; - If Supervisor is not running as a user that can open the USB device and
;   write instance/, set user= to that account.

[program:flesh]
command=/usr/bin/python3 main.py
directory=/home/orangepi/Desktop/kkt-atol5
autostart=true
autorestart=true
startsecs=5
numprocs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/flesh.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
; user=orangepi
